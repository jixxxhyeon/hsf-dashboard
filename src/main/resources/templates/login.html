<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운영진 로그인 — HSF Dashboard</title>
<style>
:root{
  color-scheme:light;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --muted2:#94a3b8;
  --line:#e2e8f0; --line2:#f1f5f9; --bg:#f8fafc; --card:#fff;
  --accent:#1d4ed8; --accent-soft:#eff6ff; --accent-line:#bfdbfe;
  --warn:#b45309; --warn-soft:#fffbeb; --warn-line:#fde68a;
  --pos:#15803d; --pos-soft:#f0fdf4; --pos-line:#bbf7d0;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --ink:#f1f5f9; --ink2:#cbd5e1; --muted:#94a3b8; --muted2:#64748b;
    --line:#2b3444; --line2:#222a37; --bg:#12151c; --card:#1a1f29;
    --accent:#7ea8ff; --accent-soft:#1c2739; --accent-line:#2f4a7a;
    --warn:#fbbf24; --warn-soft:#2a2213; --warn-line:#4d3d16;
    --pos:#4ade80; --pos-soft:#132218; --pos-line:#20402a;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:14px/1.55 -apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  min-height:100vh; display:grid; place-items:center; padding:24px;
}
.box{width:100%;max-width:360px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.3px;text-align:center}
.brand span{color:var(--accent)}
.brand small{display:block;font-size:9.5px;font-weight:700;color:var(--muted2);
             letter-spacing:1px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:24px;margin-top:20px}
h1{font-size:15px;font-weight:700;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.5}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
      font:inherit;font-size:14px;background:var(--card);color:var(--ink);margin-bottom:14px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;border:0;border-radius:8px;padding:11px;background:var(--accent);
       color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.08)}
.msg{border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:16px}
.err{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn)}
.ok{background:var(--pos-soft);border:1px solid var(--pos-line);color:var(--pos)}
.back{display:block;text-align:center;margin-top:16px;font-size:12.5px;
      color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent)}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">HSF <span>Dashboard</span><small>HANDONG SOFTWARE FOUNDATION</small></div>

    <div class="card">
      <h1>운영진 로그인</h1>
      <p class="sub">참여자 명단에는 활동 기록이 들어 있어<br>로그인한 운영진만 볼 수 있습니다.</p>

      <div class="msg err" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않습니다.</div>
      <div class="msg ok"  th:if="${param.logout}">로그아웃되었습니다.</div>

      <form method="post" th:action="@{/login}">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit">로그인</button>
      </form>
    </div>

    <a class="back" href="/">← 대시보드로 돌아가기</a>
  </div>
</body>
</html>
